name: Verify Incremento

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest pytest-cov beautifulsoup4
      - run: python -m compileall -q __init__.py backend frontend scripts
      - run: python -m pytest tests/ -q

  web-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: chrome_extensions/incremento_companion
      - run: npm run build
        working-directory: frontend
      - run: npm run build:extension
        working-directory: frontend
      - run: git diff --exit-code -- web/dist/pdf_viewer.js chrome_extensions/incremento_companion/dist
